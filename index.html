<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis AI</title>

  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 40px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
    }

    #status {
      margin-top: 25px;
      color: #00ffcc;
    }
  </style>
</head>

<body>

  <h1>🤖 JARVIS AI</h1>

  <button onclick="startListening()">🎤 Speak</button>

  <p id="status">Press the button and speak</p>

<script>
function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-IN";
    speechSynthesis.cancel();
    speechSynthesis.speak(speech);
}

function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        document.getElementById("status").innerText =
            "Speech recognition is not supported.";
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.start();

    document.getElementById("status").innerText =
        "🎤 Listening...";

    recognition.onresult = function(event) {
        const text =
            event.results[0][0].transcript.toLowerCase();

        document.getElementById("status").innerText =
            "You said: " + text;

        let reply = "";

        if (text.includes("hello") || text.includes("hi")) {
            reply = "Hello! I am JARVIS. How can I help you?";
        }
        else if (
            text.includes("your name") ||
            text.includes("who are you")
        ) {
            reply = "I am JARVIS, your voice assistant.";
        }
        else if (text.includes("time")) {
            reply = "The time is " +
                new Date().toLocaleTimeString("en-IN");
        }
        else if (text.includes("date")) {
            reply = "Today is " +
                new Date().toLocaleDateString("en-IN");
        }
        else if (text.includes("open youtube")) {
            reply = "Opening YouTube.";
            window.open("https://www.youtube.com", "_blank");
        }
        else if (text.includes("open google")) {
            reply = "Opening Google.";
            window.open("https://www.google.com", "_blank");
        }
        else if (text.includes("search google")) {
            const searchText =
                text.replace("search google", "").trim();

            if (searchText) {
                reply = "Searching Google for " + searchText;
                window.open(
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(searchText),
                    "_blank"
                );
            } else {
                reply = "What should I search for?";
            }
        }
        else if (text.includes("thank you")) {
            reply = "You're welcome.";
        }
        else {
            reply = "I heard you say " + text +
                ". I am still learning more commands.";
        }

        document.getElementById("status").innerText =
            "🤖 " + reply;

        speak(reply);
    };

    recognition.onerror = function() {
        document.getElementById("status").innerText =
            "❌ Microphone or speech recognition error.";
    };
}
</script>
